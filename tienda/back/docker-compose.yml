version: '3.8'

services:
  # ══════════════════════════════════════════════════════════════════
  # PostgreSQL Database
  # ══════════════════════════════════════════════════════════════════
  postgres:
    image: postgres:15-alpine
    container_name: tienda_digital_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-tienda_digital}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      # Persistencia de datos
      - postgres_data:/var/lib/postgresql/data
      # Ejecutar schema.sql automáticamente al iniciar
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    networks:
      - tienda_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-tienda_digital}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ══════════════════════════════════════════════════════════════════
  # Redis (Cola de Tareas)
  # ══════════════════════════════════════════════════════════════════
  redis:
    image: redis:7-alpine
    container_name: tienda_digital_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis123}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - tienda_network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5


  # ══════════════════════════════════════════════════════════════════
  # Worker (Opcional - para procesar tareas en segundo plano)
  # ══════════════════════════════════════════════════════════════════
  # worker:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile
  #   container_name: tienda_digital_worker
  #   restart: unless-stopped
  #   command: ["./worker"]
  #   environment:
  #     # Database
  #     DB_HOST: postgres
  #     DB_PORT: 5432
  #     DB_USER: ${DB_USER:-postgres}
  #     DB_PASSWORD: ${DB_PASSWORD:-postgres}
  #     DB_NAME: ${DB_NAME:-tienda_digital}
  #     # Redis
  #     REDIS_HOST: redis
  #     REDIS_PORT: 6379
  #     REDIS_PASSWORD: ${REDIS_PASSWORD:-redis123}
  #     REDIS_DB: ${REDIS_DB:-0}
  #     # Otras variables necesarias
  #     JWT_SECRET: ${JWT_SECRET}
  #     SMTP_HOST: ${SMTP_HOST}
  #     SMTP_PORT: ${SMTP_PORT:-587}
  #     SMTP_USER: ${SMTP_USER}
  #     SMTP_PASSWORD: ${SMTP_PASSWORD}
  #     SMTP_FROM: ${SMTP_FROM}
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #     redis:
  #       condition: service_healthy
  #   networks:
  #     - tienda_network

# ══════════════════════════════════════════════════════════════════
# Volúmenes para persistencia de datos
# ══════════════════════════════════════════════════════════════════
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

# ══════════════════════════════════════════════════════════════════
# Red interna para comunicación entre servicios
# ══════════════════════════════════════════════════════════════════
networks:
  tienda_network:
    driver: bridge
